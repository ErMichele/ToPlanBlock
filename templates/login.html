{% extends "base.html" %}
{% block title %}Login - ToPlanBlock{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="col-md-5">
    <div class="card border-0 shadow-lg rounded">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <h2 class="fw-bold">Welcome Back</h2>
          <p class="text-muted">Log in to manage your blocks.</p>
        </div>
        
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
          
          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input class="form-control p-3" type="email" name="email" placeholder="name@example.com" required>
          </div>
          
          <div class="mb-4">
            <div class="d-flex justify-content-between">
              <label class="form-label fw-semibold">Password</label>
            </div>
            <div class="input-group">
              <input class="form-control p-3 password-toggle-input" type="password" name="password" placeholder="••••••••" required>
              <button class="btn btn-outline-secondary px-3 password-toggle-btn" type="button">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          
          <button class="btn btn-primary w-100 py-3 fw-bold shadow-sm">Sign In</button>
        </form>
        
        <div class="text-center mt-4">
          <p class="mb-1 text-muted">Don't have an account? <a href="{{ url_for('register') }}" class="text-decoration-none fw-bold">Create one</a></p>
          <a class="small text-decoration-none" data-bs-toggle="collapse" href="#resendTokenCollapse" role="button" aria-expanded="false" aria-controls="resendTokenCollapse">
            Didn't receive or expired verification link?
          </a>
        </div>

        <div class="collapse mt-3" id="resendTokenCollapse">
          <form action="{{ url_for('resend_verification') }}" method="POST" class="border-top pt-3">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <div class="input-group input-group-sm">
              <input type="email" name="email" class="form-control" placeholder="Enter your account email" required>
              <button class="btn btn-outline-primary fw-semibold" type="submit">Resend</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/access.js') }}"></script>
{% endblock %}
